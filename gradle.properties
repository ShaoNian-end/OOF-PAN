#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Mon Aug 03 09:17:15 GMT 2026
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8 -Dhttp.proxyHost\=127.0.0.1 -Dhttp.proxyPort\=18080 -Dhttps.proxyHost\=127.0.0.1 -Dhttps.proxyPort\=18080
org.gradle.java.home=/data/user/work/jdk17
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
